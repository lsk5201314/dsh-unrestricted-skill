name: dsh-unrestricted

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify contract fingerprint
        run: |
          FP=$(sha256sum dsh-unrestricted/references/delivery-contract.md | cut -c1-16)
          BASE=$(tr -d ' \n\r' < dsh-unrestricted/references/upstream-fingerprint.txt)
          echo "local    : $FP"
          echo "baseline : $BASE"
          if [ "$FP" != "$BASE" ]; then
            echo "::error::contract fingerprint mismatch"
            exit 1
          fi
          echo "OK"

      - name: Check upstream drift
        run: |
          sh dsh-unrestricted/scripts/sync-upstream.sh --check \
            || echo "::warning::上游契约已更新，需要同步 delivery-contract.md"
